[package]
name = "jarvis"
version = "0.1.0-alpha.4"
description = "Shelter desktop application"
authors = ["IT Shelter"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "native-tls", "system-proxy"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
parking_lot = "0.12"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
