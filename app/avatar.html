<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Персонаж</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; }
      #say {
        padding: 8px 12px; box-sizing:border-box;
        font: 500 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #fff;
        background: rgba(24, 14, 36, 0.88); border: 1px solid rgba(255, 170, 220, 0.45); text-shadow: 0 1px 2px rgba(0,0,0,.6);
        border-radius: 12px; opacity: 0; transition: opacity .35s; pointer-events: none;
        max-height: 30vh; overflow: hidden; display:none;
      }
      #say.on { opacity: 1; display:block; }
      #captions {position:fixed;z-index:3;width:320px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);display:grid;gap:6px;pointer-events:none;overflow:hidden;overflow-wrap:anywhere;}
      #err:empty {display:none;}
      #err {color: #ffb4c8; font: 12px "Segoe UI", sans-serif;
             text-shadow: 0 1px 2px #000; }
      [hidden] { display:none !important; }
      #companion-menu { position:fixed; z-index:10; width:264px; max-width:calc(100vw - 24px); max-height:calc(100vh - 24px); overflow:auto; box-sizing:border-box;
        padding:12px; border-radius:16px; background:rgba(8,20,29,.97); border:1px solid #397b8a; box-shadow:0 12px 40px #0008;
        color:#dcf7ff; font:13px/1.4 "Segoe UI",sans-serif; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
      #companion-menu strong,#companion-menu input {grid-column:1/-1;}
      #companion-menu button,#companion-menu input {background:#102d3b;border:1px solid #305b6c;border-radius:8px;color:inherit;font:inherit;padding:8px;min-width:0;}
      #companion-menu button:hover,#companion-menu button:focus-visible {background:#235465;outline:1px solid #61dbf3;cursor:pointer;}
      #companion-status {padding:7px 10px;color:#dff9ff;background:#102631eF;border:1px solid #275968;border-radius:10px;font:12px/1.4 "Segoe UI",sans-serif;pointer-events:none;}
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="captions" aria-live="polite"><div id="say"></div><div id="err"></div></div>
    <script type="module" src="/src/avatar/main.ts"></script>
  </body>
</html>
