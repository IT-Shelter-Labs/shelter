name: Checks
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python tools/build_native.py
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-lock.windows.txt
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - if: runner.os == 'Windows'
        run: cargo build --release --locked
        working-directory: hud
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin
          Copy-Item -LiteralPath hud/target/release/jarvis-hud.exe -Destination bin/jarvis-hud.exe
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run test:avatar
        working-directory: app
      - run: npm run test:navigation
        working-directory: app
      - run: npm run test:i18n
        working-directory: app
      - run: npm ci --ignore-scripts
        working-directory: minecraft
      - run: npm test
        working-directory: minecraft
      - run: npm run build
        working-directory: app
      - run: cargo test --locked --lib
        working-directory: app/src-tauri
      - run: npm run desktop:build
        working-directory: app
      - if: runner.os == 'Windows'
        run: cargo check --locked
        working-directory: hud
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleCompanionDebug :app:assembleLocalDebug :app:testCompanionDebugUnitTest
        working-directory: android
