[package]
name = "jarvis-hud"
version = "0.1.0"
edition = "2021"
description = "HUD-окно Джарвиса: реактор и телеметрия, рисуется видеокартой"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
nvml-wrapper = "0.10"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
