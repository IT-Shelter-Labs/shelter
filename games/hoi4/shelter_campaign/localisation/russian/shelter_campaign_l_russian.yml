 shelter_campaign_category:0 "Shelter: задачи кампании"
 shelter_start_reserve:0 "Собрать резерв пехотного снаряжения"
 shelter_start_reserve_desc:0 "При первом запуске создаёт линию пехотного снаряжения I и запрашивает один военный завод. Цель: 500 единиц в запасе за 90 дней. Линию можно проверить в производстве, запас — в логистике."
 shelter_reserve_mission:0 "Накопить 500 единиц пехотного снаряжения I"
 shelter_reserve_mission_desc:0 "Игра проверяет запас на складе. По завершении задачи линия остаётся в производстве."
 shelter_stop_reserve:0 "Прекратить отслеживание резерва"
 shelter_stop_reserve_desc:0 "Закрывает задачу. Линия управляется в разделе производства."
